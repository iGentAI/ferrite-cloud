name: Bug report
description: Something on Ferrite Cloud, in the CLI or in the hosted MCP server did not work as documented.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Leave tokens, passwords and other secrets out of this report. Report a security problem by email to security@ferrite.cloud and not here.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead. Paste the exact error text.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The smallest set of steps, commands or requests that shows the problem.
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Application or address
      description: The application's name or URL, and roughly when the problem happened, so the request can be found.
  - type: input
    id: client
    attributes:
      label: Agent and CLI version
      description: The coding agent you used, and the output of `ferrite --version` if you use the CLI.
